services:
  # Python API Service
  - type: web
    name: scms-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn backend.main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        value: "libsql://..." # Replace with your Turso Database URL
      - key: TURSO_AUTH_TOKEN
        value: "..." # Replace with your Turso Auth Token
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: "https://your-vercel-domain.vercel.app" # Replace with your Vercel URL
