services:
  # Python API Service
  - type: web
    name: scms-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn backend.main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scms-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: "https://your-vercel-domain.vercel.app" # To be updated by user in Render Dashboard

databases:
  # PostgreSQL Database
  - name: scms-db
    databaseName: scms_db
    user: scms_user
    plan: free
